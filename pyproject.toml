[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal-plugin-twse"
version = "1.0.0"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "The Taiwan Stock Exchange for Liminal: every listed stock's daily bars from TWSE's open data, no key."
readme = "README.md"
requires-python = ">=3.10"
# the library it is written for; which app releases load it is the plugin API it declares (PLUGIN.api)
dependencies = ["liminal-lib>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
twse = "liminal_plugin_twse"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
